# Netlify production configuration (task 173).
#
# FORMAT NOTE: Netlify reads `netlify.toml` (TOML) — there is no
# `netlify.json`; a JSON config file would be silently IGNORED and the
# deploy would ship unconfigured. This TOML is the working config.
#
# TOPOLOGY: the vanilla client is built to `dist/` (npm run build) and
# served as STATIC assets by Netlify's CDN; the Node `/api/*` gateway is
# adapted to a serverless Function (netlify/functions/api.mjs) so the
# whole app runs on Netlify's FREE tier with zero servers.

[build]
  # Build the client (Vite) -> dist/ (CSS minify + JS compress).
  command = "npm run build"
  # Static assets (the client) are published from dist/.
  publish = "dist"
  # The Node API gateway lives here as a Netlify Function.
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# NOTE: the function timeout is set in netlify/functions/api.mjs via
# `export const config = { timeout: 26 }` (the netlify.toml
# [functions] timeout scalar is not accepted by the CLI schema).

# Route the API to the serverless function (first match wins, so this
# MUST precede the SPA fallback below).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback: any path with no matching static file serves the shell.
# Netlify serves existing files in `publish/` BEFORE redirects (no force),
# so dist/index.html, dist/robots.txt and dist/assets/* are untouched.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (task 182): Netlify serves HSTS + the HTTPS redirect
# by default but NOT the rest — added here. The CSP is tuned for the
# vanilla client (external /assets bundle, same-origin /api, data: for
# the inline favicon SVG; no inline scripts, no eval).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# Hashed build assets are content-addressed — cache them immutably.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
